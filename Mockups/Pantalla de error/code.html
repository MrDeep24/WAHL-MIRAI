<script>
        // Simple micro-interaction for the illustration
        document.addEventListener('mousemove', (e) => {
            const illustration = document.querySelector('.illustration-float');
            if(illustration) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                illustration.style.transform = `translate(${xAxis}px, ${yAxis}px)`;
            }
        });
        
        // Reset transform on mouse leave to allow animation to continue smoothly
        document.addEventListener('mouseleave', () => {
             const illustration = document.querySelector('.illustration-float');
             if(illustration) {
                 illustration.style.transform = `translate(0px, 0px)`;
                 // Re-add the animation class if needed or just let the CSS handle it if it wasn't removed.
             }
        });
    </script>
