<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 742 204" overflow="visible" role="img" aria-label="Diagrama de 3 pasos para postularse como candidato: Paso 1 Entra a Postularme, Paso 2 Carga tus soportes, Paso 3 Espera aprobación.">
    
    <!-- Hoja de estilos interna -->
    <defs>
        <style>
            .box { fill: #eff4ff; stroke: #c3c6d1; stroke-width: 2.5; }
            .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #0b1c30; }
            .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #424750; }
            .badge { fill: #003466; }
            .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
            .arrow { fill: none; stroke: #c3c6d1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon { fill: none; stroke: #003466; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        </style>
    </defs>

    <!-- ========================================== -->
    <!-- LÍNEAS CONECTORAS                          -->
    <!-- ========================================== -->
    
    <g class="arrow">
        <line x1="216" y1="82" x2="240" y2="82"/>
        <polyline points="234,76 240,82 234,88"/>
    </g>

    <g class="arrow">
        <line x1="462" y1="82" x2="486" y2="82"/>
        <polyline points="480,76 486,82 480,88"/>
    </g>

    <!-- ========================================== -->
    <!-- NODO 1: ENTRA A POSTULARME                 -->
    <!-- ========================================== -->
    
    <rect x="0" y="38" width="210" height="88" rx="12" class="box" />
    
    <g transform="translate(24, 70)" class="icon">
        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="8.5" cy="7" r="4"/>
        <line x1="20" y1="8" x2="20" y2="14"/>
        <line x1="23" y1="11" x2="17" y2="11"/>
    </g>
    
    <!-- Textos 1 (Ajustados en múltiples líneas) -->
    <text x="58" y="68" class="text-title">Entra a Postularme</text>
    <text x="58" y="88" class="text-sub">
        <tspan x="58" dy="0">En etapa de</tspan>
        <tspan x="58" dy="16">Inscripción</tspan>
    </text>
    
    <circle cx="210" cy="38" r="16" class="badge" />
    <text x="210" y="40" class="badge-text">1</text>

    <!-- ========================================== -->
    <!-- NODO 2: CARGA TUS SOPORTES                 -->
    <!-- ========================================== -->
    
    <rect x="246" y="38" width="210" height="88" rx="12" class="box" />
    
    <g transform="translate(270, 70)" class="icon">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
    </g>
    
    <!-- Textos 2 (Ajustados en múltiples líneas) -->
    <text x="304" y="68" class="text-title">Carga tus soportes</text>
    <text x="304" y="88" class="text-sub">
        <tspan x="304" dy="0">Propuestas, plan</tspan>
        <tspan x="304" dy="16">y requisitos</tspan>
    </text>
    
    <circle cx="456" cy="38" r="16" class="badge" />
    <text x="456" y="40" class="badge-text">2</text>

    <!-- ========================================== -->
    <!-- NODO 3: ESPERA APROBACIÓN                  -->
    <!-- ========================================== -->
    
    <rect x="492" y="38" width="210" height="88" rx="12" class="box" />
    
    <g transform="translate(516, 70)" class="icon">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
    </g>
    
    <!-- Textos 3 (Ajustados en múltiples líneas) -->
    <text x="550" y="68" class="text-title">Espera aprobación</text>
    <text x="550" y="88" class="text-sub">
        <tspan x="550" dy="0">Revisión del</tspan>
        <tspan x="550" dy="16">Administrador</tspan>
    </text>
    
    <circle cx="702" cy="38" r="16" class="badge" />
    <text x="702" y="40" class="badge-text">3</text>

</svg>
