<svg viewBox="0 0 702 164" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c3c6d1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  
    <path d="M210 82.0 L248 82.0" stroke="#c3c6d1" stroke-width="2"
          marker-end="url(#arrowhead)"/>
    <path d="M446 82.0 L484 82.0" stroke="#c3c6d1" stroke-width="2"
          marker-end="url(#arrowhead)"/>
  
    <!-- Paso 1: Ingresa tu documento -->
    <g>
      <rect x="20" y="40" width="190" height="84" rx="10"
            fill="#eff4ff" stroke="#c3c6d1" stroke-width="1"/>
      <circle cx="192" cy="58" r="11" fill="#003466"/>
      <text x="192" y="58" text-anchor="middle" dominant-baseline="central"
            font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
      <!-- Icono: documento/ID con número -->
      <g transform="translate(34,52) scale(1.0833333333333333)">
        <rect x="4" y="3" width="16" height="18" rx="2" fill="none" stroke="#003466" stroke-width="1.6"/>
        <path d="M8 8h8M8 12h8M8 16h5" stroke="#003466" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="70" y="74" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#0b1c30">Ingresa tu documento</text>
      <text x="70" y="94" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#424750">El colegio te precarga</text>
    </g>
    <!-- Paso 2: Define tus datos -->
    <g>
      <rect x="256" y="40" width="190" height="84" rx="10"
            fill="#eff4ff" stroke="#c3c6d1" stroke-width="1"/>
      <circle cx="428" cy="58" r="11" fill="#003466"/>
      <text x="428" y="58" text-anchor="middle" dominant-baseline="central"
            font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
      <!-- Icono: sobre de correo + candado pequeño -->
      <g transform="translate(270,52) scale(1.0833333333333333)">
        <rect x="3" y="7" width="14" height="10" rx="2" fill="none" stroke="#003466" stroke-width="1.6"/>
        <path d="M3 9l7 5 7-5" fill="none" stroke="#003466" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="16" y="3" width="6" height="5" rx="1.5" fill="none" stroke="#003466" stroke-width="1.4"/>
        <path d="M18 3V2a1 1 0 0 1 2 0v1" fill="none" stroke="#003466" stroke-width="1.4" stroke-linecap="round"/>
      </g>
      <text x="306" y="74" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#0b1c30">Define correo y clave</text>
      <text x="306" y="94" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#424750">Mín. 8 car. + mayúscula</text>
    </g>
    <!-- Paso 3: Cuenta activada -->
    <g>
      <rect x="492" y="40" width="190" height="84" rx="10"
            fill="#eff4ff" stroke="#c3c6d1" stroke-width="1"/>
      <circle cx="664" cy="58" r="11" fill="#003466"/>
      <text x="664" y="58" text-anchor="middle" dominant-baseline="central"
            font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
      <!-- Icono: círculo con checkmark (cuenta creada) -->
      <g transform="translate(506,52) scale(1.0833333333333333)">
        <circle cx="12" cy="12" r="9" fill="none" stroke="#2f9e63" stroke-width="1.6"/>
        <path d="M8 12.5l2.5 2.5L16 9.5" fill="none" stroke="#2f9e63" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="542" y="74" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13.5" font-weight="600" fill="#0b1c30">¡Cuenta activada!</text>
      <text x="542" y="94" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="11.5" fill="#424750">Ya puedes ingresar</text>
    </g>
</svg>
