<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 742 204" overflow="visible" role="img" aria-label="Diagrama en 3 pasos para crear cuenta: Paso 1 Ingresa tu documento, Paso 2 Define correo y clave, Paso 3 Cuenta activada.">
    
    <!-- Hoja de estilos interna -->
    <defs>
        <style>
            .box { fill: #eff4ff; stroke: #c3c6d1; stroke-width: 2.5; }
            .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #0b1c30; }
            .badge { fill: #003466; }
            .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
            .arrow { fill: none; stroke: #c3c6d1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon { fill: none; stroke: #003466; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon-success { fill: none; stroke: #059669; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        </style>
    </defs>

    <!-- ========================================== -->
    <!-- LÍNEAS CONECTORAS                          -->
    <!-- ========================================== -->
    
    <g class="arrow">
        <line x1="216" y1="82" x2="240" y2="82"/>
        <polyline points="234,76 240,82 234,88"/>
    </g>

    <g class="arrow">
        <line x1="462" y1="82" x2="486" y2="82"/>
        <polyline points="480,76 486,82 480,88"/>
    </g>

    <!-- ========================================== -->
    <!-- NODO 1: INGRESA TU DOCUMENTO               -->
    <!-- ========================================== -->
    
    <rect x="0" y="38" width="210" height="88" rx="12" class="box" />
    
    <!-- Ícono 1: Carnet de Identidad -->
    <g transform="translate(24, 70)" class="icon">
        <rect x="3" y="5" width="18" height="14" rx="2"/>
        <circle cx="8" cy="12" r="2.5"/>
        <line x1="13" y1="10" x2="18" y2="10"/>
        <line x1="13" y1="14" x2="18" y2="14"/>
    </g>
    
    <!-- Texto 1 (Ajustado en múltiples líneas) -->
    <text x="58" y="74" class="text-title">
        <tspan x="58" dy="0">Ingresa tu</tspan>
        <tspan x="58" dy="20">documento</tspan>
    </text>
    
    <circle cx="210" cy="38" r="16" class="badge" />
    <text x="210" y="40" class="badge-text">1</text>

    <!-- ========================================== -->
    <!-- NODO 2: DEFINE CORREO Y CLAVE              -->
    <!-- ========================================== -->
    
    <rect x="246" y="38" width="210" height="88" rx="12" class="box" />
    
    <!-- Ícono 2: Usuario + Candado (Credenciales) -->
    <g transform="translate(270, 70)" class="icon">
        <!-- Silueta de usuario -->
        <circle cx="9" cy="7" r="4"/>
        <path d="M3 21v-2a4 4 0 0 1 4-4h4"/>
        <!-- Candado -->
        <rect x="13" y="14" width="8" height="6" rx="1"/>
        <path d="M14.5 14v-2a2.5 2.5 0 1 1 5 0v2"/>
    </g>
    
    <!-- Texto 2 (Ajustado en múltiples líneas) -->
    <text x="306" y="74" class="text-title">
        <tspan x="306" dy="0">Define correo</tspan>
        <tspan x="306" dy="20">y clave</tspan>
    </text>
    
    <circle cx="456" cy="38" r="16" class="badge" />
    <text x="456" y="40" class="badge-text">2</text>

    <!-- ========================================== -->
    <!-- NODO 3: CUENTA ACTIVADA                    -->
    <!-- ========================================== -->
    
    <rect x="492" y="38" width="210" height="88" rx="12" class="box" />
    
    <!-- Ícono 3: Círculo de Éxito (Verde) -->
    <g transform="translate(516, 70)" class="icon-success">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="8 12 11 15 16 9"/>
    </g>
    
    <!-- Texto 3 (Centrado en una sola línea ya que es más corto) -->
    <text x="552" y="86" class="text-title">Cuenta activada</text>
    
    <circle cx="702" cy="38" r="16" class="badge" />
    <text x="702" y="40" class="badge-text">3</text>

</svg>
