<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 742 204" overflow="visible" role="img" aria-label="Diagrama de 3 pasos para autogestión de perfil: Paso 1 Abre tu perfil, Paso 2 Edita tus datos, Paso 3 Guarda los cambios.">
    
    <!-- Hoja de estilos interna -->
    <defs>
        <style>
            .box { fill: #eff4ff; stroke: #c3c6d1; stroke-width: 2.5; }
            .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: bold; fill: #0b1c30; }
            .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #424750; }
            .badge { fill: #003466; }
            .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: bold; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
            .arrow { fill: none; stroke: #c3c6d1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
            .icon { fill: none; stroke: #003466; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        </style>
    </defs>

    <!-- ========================================== -->
    <!-- LÍNEAS CONECTORAS                          -->
    <!-- ========================================== -->
    
    <g class="arrow">
        <line x1="216" y1="82" x2="240" y2="82"/>
        <polyline points="234,76 240,82 234,88"/>
    </g>

    <g class="arrow">
        <line x1="462" y1="82" x2="486" y2="82"/>
        <polyline points="480,76 486,82 480,88"/>
    </g>

    <!-- ========================================== -->
    <!-- NODO 1: ENTRA A TU PERFIL                  -->
    <!-- ========================================== -->
    
    <rect x="0" y="38" width="210" height="88" rx="12" class="box" />
    
    <!-- Ícono 1: Usuario (Intacto) -->
    <g transform="translate(24, 70)" class="icon">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
    </g>
    
    <!-- Textos 1 (Ajustado en múltiples líneas) -->
    <text x="58" y="66" class="text-title">
        <tspan x="58" dy="0">Entra a tu</tspan>
        <tspan x="58" dy="17">perfil</tspan>
    </text>
    <text x="58" y="97" class="text-sub">Menú de usuario</text>
    
    <circle cx="210" cy="38" r="16" class="badge" />
    <text x="210" y="40" class="badge-text">1</text>

    <!-- ========================================== -->
    <!-- NODO 2: EDITA TUS DATOS                    -->
    <!-- ========================================== -->
    
    <rect x="246" y="38" width="210" height="88" rx="12" class="box" />
    
    <!-- Ícono 2: Lápiz (Intacto) -->
    <g transform="translate(270, 70)" class="icon">
        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
    </g>
    
    <!-- Textos 2 (Ajustado en múltiples líneas) -->
    <text x="304" y="66" class="text-title">
        <tspan x="304" dy="0">Edita tus</tspan>
        <tspan x="304" dy="17">datos</tspan>
    </text>
    <text x="304" y="97" class="text-sub">Correo o clave</text>
    
    <circle cx="456" cy="38" r="16" class="badge" />
    <text x="456" y="40" class="badge-text">2</text>

    <!-- ========================================== -->
    <!-- NODO 3: GUARDA LOS CAMBIOS                 -->
    <!-- ========================================== -->
    
    <rect x="492" y="38" width="210" height="88" rx="12" class="box" />
    
    <!-- Ícono 3: Disquete (Intacto) -->
    <g transform="translate(516, 70)" class="icon">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
        <polyline points="17 21 17 13 7 13 7 21"/>
        <polyline points="7 3 7 8 15 8"/>
    </g>
    
    <!-- Textos 3 (Ajustado en múltiples líneas) -->
    <text x="550" y="66" class="text-title">
        <tspan x="550" dy="0">Guarda los</tspan>
        <tspan x="550" dy="17">cambios</tspan>
    </text>
    <text x="550" y="97" class="text-sub">Actualización exitosa</text>
    
    <circle cx="702" cy="38" r="16" class="badge" />
    <text x="702" y="40" class="badge-text">3</text>

</svg>
