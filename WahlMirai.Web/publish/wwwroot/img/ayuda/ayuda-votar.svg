        <circle cx="9" cy="8.2" r="1" fill="#003466"/>
      </g>
      <text x="70" y="74" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#0b1c30">Elige un candidato</text>
      <text x="70" y="96" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#424750">En el tarjetón electoral</text>
    </g>
    <g>
      <rect x="256" y="40" width="190" height="84" rx="10"
