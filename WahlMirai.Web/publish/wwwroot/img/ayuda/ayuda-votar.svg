        <circle cx="4" cy="18" r="1.4" fill="#003466"/>
      </g>
      <text x="306" y="74" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#0b1c30">Revisa sus propuestas</text>
      <text x="306" y="96" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#424750">Ventana emergente</text>
