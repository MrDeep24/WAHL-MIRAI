<svg viewBox="-20 -20 742 204" xmlns="http://www.w3.org/2000/svg" role="img" overflow="visible"
     aria-label="Diagrama de 3 pasos para votar: Paso 1, Elige un candidato en el tarjetón electoral; Paso 2, Revisa sus propuestas en la ventana emergente; Paso 3, Confirma tu voto, ya no se puede cambiar.">
  <title>Cómo votar en Wahl Mirai</title>
  <desc>Diagrama secuencial de 3 pasos: 1) Elige un candidato, 2) Revisa sus propuestas, 3) Confirma tu voto.</desc>
  <defs>
