<svg viewBox="-20 -20 710 230" xmlns="http://www.w3.org/2000/svg" role="img" overflow="visible"
     aria-label="Diagrama de 3 pasos para ver resultados: Paso 1, Vota en la elección mientras está activa; Paso 2, Entra a Resultados, se habilita tras votar; Paso 3, Sigue el conteo en vivo, se actualiza automáticamente." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Cuándo y cómo ver los resultados en Wahl Mirai</title>
  <desc>Diagrama secuencial de 3 pasos: 1) Vota en la elección, 2) Entra a Resultados, 3) Sigue el conteo en vivo.</desc>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#c3c6d1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <path d="M214 105 L246 105" stroke="#c3c6d1" stroke-width="2.5" marker-end="url(#arrowhead)"/>
  <path d="M444 105 L476 105" stroke="#c3c6d1" stroke-width="2.5" marker-end="url(#arrowhead)"/>

  <!-- Paso 1 -->
  <g>
    <rect x="20" y="20" width="190" height="170" rx="10" fill="#eff4ff" stroke="#c3c6d1" stroke-width="2.5"/>
    <rect x="36" y="36" width="40" height="40" rx="10" fill="#e0eaff"/>
    <g transform="translate(44,44)">
      <rect x="2" y="2" width="20" height="20" rx="4" fill="none" stroke="#003466" stroke-width="2"/>
      <path d="M7 12.5l3.5 3.5L17 8" fill="none" stroke="#003466" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="192" cy="44" r="13" fill="#003466"/>
    <text x="192" y="44" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c30">
      <tspan x="38" y="116">Vota en la</tspan>
      <tspan x="38" y="135">elección</tspan>
    </text>
    <text font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#424750">
      <tspan x="38" y="157">Mientras está</tspan>
      <tspan x="38" y="173">activa</tspan>
    </text>
  </g>

  <!-- Paso 2 -->
  <g>
    <rect x="250" y="20" width="190" height="170" rx="10" fill="#eff4ff" stroke="#c3c6d1" stroke-width="2.5"/>
    <rect x="266" y="36" width="40" height="40" rx="10" fill="#e0eaff"/>
    <g transform="translate(274,44)">
      <path d="M3 21h18" stroke="#003466" stroke-width="2" stroke-linecap="round"/>
      <rect x="5" y="13" width="4" height="8" rx="1" fill="#003466"/>
      <rect x="11" y="8" width="4" height="13" rx="1" fill="#003466"/>
      <rect x="17" y="3" width="4" height="18" rx="1" fill="#003466"/>
    </g>
    <circle cx="422" cy="44" r="13" fill="#003466"/>
    <text x="422" y="44" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c30">
      <tspan x="268" y="116">Entra a</tspan>
      <tspan x="268" y="135">Resultados</tspan>
    </text>
    <text font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#424750">
      <tspan x="268" y="157">Se habilita</tspan>
      <tspan x="268" y="173">tras votar</tspan>
    </text>
  </g>

  <!-- Paso 3 -->
  <g>
    <rect x="480" y="20" width="190" height="170" rx="10" fill="#eff4ff" stroke="#c3c6d1" stroke-width="2.5"/>
    <rect x="496" y="36" width="40" height="40" rx="10" fill="#e0eaff"/>
    <g transform="translate(504,44)">
      <path d="M20 11A8 8 0 0 0 6.5 6.5L4 9" fill="none" stroke="#003466" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 4v5h5" fill="none" stroke="#003466" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 13A8 8 0 0 0 17.5 17.5L20 15" fill="none" stroke="#003466" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20 20v-5h-5" fill="none" stroke="#003466" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="652" cy="44" r="13" fill="#003466"/>
    <text x="652" y="44" text-anchor="middle" dominant-baseline="central"
          font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#0b1c30">
      <tspan x="498" y="116">Sigue el conteo</tspan>
      <tspan x="498" y="135">en vivo</tspan>
    </text>
    <text font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#424750">
      <tspan x="498" y="157">Se actualiza</tspan>
      <tspan x="498" y="173">automáticamente</tspan>
    </text>
  </g>
</svg>
